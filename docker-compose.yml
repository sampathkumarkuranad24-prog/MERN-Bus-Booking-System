services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: mongodb://mongodb:27017/bus_booking
      PORT: 8080
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: